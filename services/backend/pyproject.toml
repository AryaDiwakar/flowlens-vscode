[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlens-backend"
version = "0.1.0"
description = "Local analysis service for the FlowLens VS Code extension"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "sqlglot==26.16.4",
  "duckdb==1.2.1",
  "networkx==3.4.2",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
